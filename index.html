<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Markdown & Code highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <link rel="stylesheet" href="styles.css?v=3" />
  <link rel="stylesheet" href="animations.css?v=3" />
</head>
<body>
  <!-- Ambient Aurora Glow Canvas -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>
  <div class="ambient-glow glow-3" aria-hidden="true"></div>

  <div class="app-shell" id="appShell">
    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-spark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
            </svg>
          </div>
          <span class="brand-name">NovaChat</span>
        </div>
        <button class="icon-btn mobile-only" id="closeSidebarBtn" title="關閉側邊欄">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-actions">
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>開啟新對話</span>
          <span class="kbd-pill">⌘K</span>
        </button>
      </div>

      <div class="chat-list-section">
        <div class="chat-list" id="chatList" role="list">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="api-status-card" id="openSettingsSidebarBtn">
          <div class="status-indicator-wrap">
            <span class="status-dot-ring">
              <span class="status-dot" id="sidebarStatusDot"></span>
            </span>
            <div class="status-text-group">
              <div class="status-title" id="sidebarProviderName">xAI Grok</div>
              <div class="status-subtitle" id="sidebarKeyStatus">API 設置</div>
            </div>
          </div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main Content Area -->
    <main class="main-area">
      <!-- Top Navigation Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="toggleSidebarBtn" title="切換側欄">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M9 3v18"/>
            </svg>
          </button>

          <!-- Model Switcher Pill -->
          <button class="model-pill" id="openSettingsTopBtn" title="點擊切換模型或設定 API">
            <span class="provider-badge" id="topProviderBadge">xAI Grok</span>
            <span class="model-name" id="topModelName">grok-4.7</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>
        </div>

        <div class="topbar-right">
          <button class="icon-btn" id="openPromptModalBtn" title="提示詞與參數">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
              <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
              <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
            </svg>
          </button>

          <button class="icon-btn" id="exportChatBtn" title="匯出 Markdown">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>

          <button class="icon-btn" id="themeToggleBtn" title="切換深淺模式">
            <svg id="themeIconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg id="themeIconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Scrollable Messages Container -->
      <div class="messages-viewport" id="messagesViewport">
        <!-- Elegant Minimalist Empty State with Soft Gradient -->
        <div class="empty-state" id="emptyState">
          <div class="empty-hero">
            <div class="hero-orb">
              <div class="orb-inner"></div>
            </div>
            <h1 class="gradient-text">今天想探索什麼？</h1>
          </div>
        </div>

        <!-- Active Conversation Stream -->
        <div class="messages-list hidden" id="messagesList" aria-live="polite"></div>
      </div>

      <!-- Bottom Input Composer -->
      <div class="composer-container">
        <div class="composer-box" id="composerBox">
          <div class="attachment-strip hidden" id="attachmentStrip"></div>

          <textarea
            id="messageInput"
            rows="1"
            placeholder="輸入訊息... (Enter 發送，Shift + Enter 換行)"
          ></textarea>

          <div class="composer-toolbar">
            <div class="composer-tools-left">
              <label class="tool-btn" title="附加圖片或文件">
                <input type="file" id="fileInput" accept="image/*,.txt,.md,.json,.csv,.py,.js,.ts" multiple hidden />
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
              </label>

              <button type="button" class="tool-btn" id="clearContextBtn" title="清空對話">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                </svg>
              </button>
            </div>

            <div class="composer-tools-right">
              <button type="button" class="stop-btn hidden" id="stopGenBtn" title="停止生成">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="6" width="12" height="12" rx="2"/>
                </svg>
              </button>

              <button type="button" class="send-btn" id="sendBtn" title="發送" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- =========================================================
       CLEAN & ELEGANT API SETTINGS MODAL
       ========================================================= -->
  <dialog class="modal-dialog" id="apiSettingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">API 串接設定</h2>
        <button class="icon-btn" id="closeApiModalBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- Sleek Provider Tabs -->
        <div class="provider-tabs" id="providerTabs">
          <button type="button" class="tab-btn active" data-provider="grok">
            <span class="tab-name">xAI Grok</span>
          </button>
          <button type="button" class="tab-btn" data-provider="openai">
            <span class="tab-name">OpenAI</span>
          </button>
          <button type="button" class="tab-btn" data-provider="gemini">
            <span class="tab-name">Gemini</span>
          </button>
          <button type="button" class="tab-btn" data-provider="anthropic">
            <span class="tab-name">Claude</span>
          </button>
          <button type="button" class="tab-btn" data-provider="openrouter">
            <span class="tab-name">OpenRouter</span>
          </button>
          <button type="button" class="tab-btn" data-provider="deepseek">
            <span class="tab-name">DeepSeek</span>
          </button>
          <button type="button" class="tab-btn" data-provider="ollama">
            <span class="tab-name">Ollama 本地</span>
          </button>
          <button type="button" class="tab-btn" data-provider="custom">
            <span class="tab-name">自訂 API</span>
          </button>
          <button type="button" class="tab-btn" data-provider="demo">
            <span class="tab-name">免 Key 預覽</span>
          </button>
        </div>

        <!-- Clean Config Form -->
        <div class="settings-form">
          <!-- API Key Input -->
          <div class="form-group" id="apiKeyGroup">
            <label class="form-label" for="apiKeyInput">API Key</label>
            <div class="input-wrap">
              <input type="password" id="apiKeyInput" class="form-input mono" placeholder="請貼上您的 API Key" autocomplete="off" />
              <button type="button" class="subtle-btn" id="toggleKeyVisibilityBtn">顯示</button>
            </div>
          </div>

          <!-- Model Selection -->
          <div class="form-group">
            <label class="form-label" for="modelInput">模型 (Model)</label>
            <input type="text" id="modelInput" class="form-input mono" placeholder="模型名稱" list="modelSuggestionsList" />
            <datalist id="modelSuggestionsList"></datalist>
            <div class="model-pills-row" id="modelPresetChips"></div>
          </div>

          <!-- Collapsible: Advanced (Base URL, Format, Headers) -->
          <details class="minimal-details" id="advancedSettings">
            <summary>端點與進階設定 (Base URL / Headers)</summary>
            <div class="details-body">
              <div class="form-group">
                <label class="form-label" for="apiBaseUrlInput">Base URL</label>
                <input type="url" id="apiBaseUrlInput" class="form-input mono" />
              </div>

              <div class="form-group">
                <label class="form-label" for="apiFormatSelect">協定格式</label>
                <select id="apiFormatSelect" class="form-select">
                  <option value="openai">OpenAI 相容協定 (/chat/completions)</option>
                  <option value="gemini">Google Gemini 原生協定</option>
                  <option value="anthropic">Anthropic 原生協定 (/messages)</option>
                  <option value="demo">離線預覽模擬器</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="customHeadersInput">自訂 HTTP Headers (選填 JSON)</label>
                <input type="text" id="customHeadersInput" class="form-input mono" placeholder='{"X-Custom-Header": "value"}' />
              </div>
            </div>
          </details>
        </div>

        <div class="test-feedback hidden" id="testResultBox"></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="subtle-btn" id="testConnectionBtn">測試連線</button>
        <div class="footer-actions">
          <button type="button" class="subtle-btn" id="cancelApiModalBtn">取消</button>
          <button type="button" class="primary-btn" id="saveApiSettingsBtn">儲存設定</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Prompt Modal -->
  <dialog class="modal-dialog" id="promptSettingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">提示詞與參數</h2>
        <button class="icon-btn" id="closePromptModalBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="systemPromptInput">系統提示詞 (System Prompt)</label>
          <textarea id="systemPromptInput" class="form-textarea" rows="3" placeholder="設定 AI 的角色設定或回答規範..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <div class="label-inline">
              <label class="form-label">Temperature</label>
              <span class="mono-val" id="temperatureVal">0.7</span>
            </div>
            <input type="range" id="temperatureRange" min="0" max="2" step="0.1" value="0.7" class="form-range" />
          </div>

          <div class="form-group">
            <div class="label-inline">
              <label class="form-label">歷史訊息數量</label>
              <span class="mono-val" id="contextLimitVal">20 則</span>
            </div>
            <input type="range" id="contextLimitRange" min="2" max="50" step="2" value="20" class="form-range" />
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="subtle-btn" id="resetPromptParamsBtn">還原預設</button>
        <button type="button" class="primary-btn" id="savePromptParamsBtn">儲存</button>
      </div>
    </div>
  </dialog>

  <div class="toast-container" id="toastContainer"></div>
  <script src="app.js"></script>
</body>
</html>
